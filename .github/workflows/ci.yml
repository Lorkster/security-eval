name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # With the harness, so the adapter tests run rather than skip. They are
      # the ones that notice when the harness changes under us.
      - run: pip install -e ".[dev,harness,batch]"
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -q
